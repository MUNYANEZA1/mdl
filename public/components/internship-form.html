<form class="registration-form standalone-form wide-form" id="internshipForm" data-api="/api/internship-applications"><div class="form-row"><label>Full name *<input name="fullName" required maxlength="150" autocomplete="name"></label><label>Email *<input name="email" type="email" required maxlength="190" autocomplete="email"></label></div><div class="form-row"><label>Phone *<input name="phone" required maxlength="40" autocomplete="tel" placeholder="+250 7XX XXX XXX"></label><label>Country *<input name="country" required maxlength="100" value="Rwanda"></label></div><div class="form-row"><label>Education level *<select name="educationLevel" required><option value="">Choose level</option><option>High school</option><option>TVET</option><option>College</option><option>University</option><option>Graduate</option><option>Career changer</option></select></label><label>School, university or institution *<input name="institution" required maxlength="190"></label></div><div class="form-row"><label>Field of study *<input name="fieldOfStudy" required maxlength="150"></label><label>Internship type *<select name="internshipType" required><option value="">Choose type</option><option>Academic</option><option>Professional</option></select></label></div><div class="form-row"><label>Preferred department *<select name="department" required><option value="">Choose department</option><option>Software Development</option><option>Web Development</option><option>Mobile Application Development</option><option>IT Support and Networking</option><option>Cybersecurity</option><option>Data Analysis and Database Management</option><option>UI/UX and Graphic Design</option><option>Digital Marketing</option><option>Business Administration</option><option>Project Management</option><option>Research and Innovation</option><option>Digital Education and Training</option></select></label><label>Preferred duration *<input name="preferredDuration" required maxlength="100" placeholder="e.g. 8 weeks"></label></div><div class="form-row"><label>Preferred start date<input name="startDate" type="date"></label><label>Portfolio or GitHub link<input name="portfolioUrl" type="url" maxlength="500" placeholder="https://"></label></div><label>Reason for applying *<textarea name="reason" required maxlength="4000" rows="3"></textarea></label><label>Skills and interests<textarea name="skills" maxlength="4000" rows="3"></textarea></label><label class="consent"><input type="checkbox" name="guardianConsent"><span>I confirm parent/guardian involvement where required for a minor applicant.</span></label><label class="consent"><input type="checkbox" name="consent" required><span>I agree MDL may use this information to assess and respond to this application. *</span></label><p class="form-small">Do not attach sensitive documents. Minors should apply through their school or with guardian involvement. Read the <a href="/privacy.html">privacy notice</a>.</p><button class="btn btn-primary submit-btn" type="submit">Submit application <span>→</span></button><p class="form-message" role="status" aria-live="polite"></p></form>
