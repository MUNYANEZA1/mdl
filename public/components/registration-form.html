<form class="registration-form" id="registrationForm"><div class="form-heading"><h3>Register your interest</h3><p>Fields marked * are required.</p></div><div class="form-row"><label>Full name *<input name="fullName" required minlength="2" maxlength="150" autocomplete="name"></label><label>Phone *<input name="phone" required minlength="7" maxlength="40" autocomplete="tel" placeholder="+250 7XX XXX XXX"></label></div><label>Email<input name="email" type="email" maxlength="190" autocomplete="email"></label><label>Course *<select name="course" id="courseSelect" required><option value="">Choose a course</option></select></label><div class="form-row"><label>Current level *<select name="skillLevel" required><option value="">Choose level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>Learning format *<select name="learningMode" required><option value="">Choose format</option><option value="Individual">One-to-one</option><option value="Group">Group training</option><option value="Online">Online</option><option value="Corporate">For my organization</option></select></label></div><label>Preferred schedule<input name="preferredSchedule" maxlength="100"></label><label>Learning objectives<textarea name="goals" rows="3" maxlength="2000"></textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>I agree MDL may use this information to respond to my registration. *</span></label><button class="btn btn-primary submit-btn" id="submitButton" type="submit">Submit registration <span>→</span></button><p class="form-message" id="formMessage" role="status" aria-live="polite"></p></form>
