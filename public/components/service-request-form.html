<form class="registration-form standalone-form" id="serviceRequestForm" data-api="/api/service-requests"><label>Service category *<select name="serviceCategory" required><option value="">Choose a service</option><option>Software and web solutions</option><option>Mobile application development</option><option>IT support and infrastructure</option><option>Data and business intelligence</option><option>Creative and digital services</option><option>Cybersecurity and digital safety</option><option>Other / custom solution</option></select></label><div class="form-row"><label>Organization<input name="organizationName" maxlength="190"></label><label>Sector<input name="sector" maxlength="100"></label></div><div class="form-row"><label>Contact person *<input name="contactName" required maxlength="150" autocomplete="name"></label><label>Phone *<input name="phone" required maxlength="40" autocomplete="tel"></label></div><label>Email<input name="email" type="email" maxlength="190" autocomplete="email"></label><label>What do you need?<textarea name="description" maxlength="4000" rows="4"></textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>I agree MDL may use these details to respond. Read our <a href="/privacy.html">privacy notice</a>. *</span></label><button class="btn btn-primary submit-btn" type="submit">Request this service <span>→</span></button><p class="form-message" role="status" aria-live="polite"></p></form>
