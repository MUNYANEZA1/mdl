<form class="registration-form standalone-form" id="corporateForm" data-api="/api/corporate-training-requests"><label>Organization name *<input name="organizationName" required maxlength="190"></label><div class="form-row"><label>Contact person *<input name="contactName" required maxlength="150" autocomplete="name"></label><label>Phone *<input name="phone" required maxlength="40" autocomplete="tel"></label></div><div class="form-row"><label>Email<input name="email" type="email" maxlength="190" autocomplete="email"></label><label>Number of participants *<input name="participantCount" type="number" required min="1" max="10000"></label></div><label>Training topic *<select name="topic" required><option value="">Choose a topic</option><option>Digital literacy</option><option>Microsoft Office</option><option>Excel and data analysis</option><option>Cybersecurity awareness</option><option>Digital productivity</option><option>Programming and technical skills</option><option>Customized organizational training</option></select></label><div class="form-row"><label>Preferred delivery *<select name="deliveryMethod" required><option value="">Choose method</option><option>In person</option><option>Online</option><option>Flexible</option></select></label><label>Preferred dates<input name="preferredDates" maxlength="190"></label></div><label>Additional requirements<textarea name="requirements" maxlength="4000" rows="4"></textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>I agree MDL may use these details to respond. Read our <a href="/privacy.html">privacy notice</a>. *</span></label><button class="btn btn-primary submit-btn" type="submit">Request team training <span>→</span></button><p class="form-message" role="status" aria-live="polite"></p></form>
